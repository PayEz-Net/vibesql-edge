apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# secret-template.yaml is listed so the bundle is complete, but it holds REPLACE_ME
# placeholders only. Create the real secret out-of-band (kubectl create secret generic /
# Azure Key Vault CSI) and drop it from this list before running 'kubectl apply -k'.
resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - secret-template.yaml
