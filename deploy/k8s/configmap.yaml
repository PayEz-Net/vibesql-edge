apiVersion: v1
kind: ConfigMap
metadata:
  name: keelbase-edge-config
  namespace: internal-services
data:
  # Same defaults as KeelBase.Edge/appsettings.json (KeelEdge:TierLimits)
  KeelEdge__TierLimits__ApiCallsPerDay: "10000"
  KeelEdge__TierLimits__DocumentReadsPerDay: "20000"
  KeelEdge__TierLimits__DocumentWritesPerDay: "2000"
  KeelEdge__TierLimits__SchemaOpsPerDay: "200"
  KeelEdge__TierLimits__BatchOpsPerDay: "100"
